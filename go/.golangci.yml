# golangci-lint config for the Sonarr Go port.
# We start strict to keep the port idiomatic from day one.

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - errcheck
    - errorlint
    - gocritic
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused

  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - "checkPrivateReceivers"
            - "disableStutteringCheck"

  exclusions:
    paths:
      - analysis
      - test/contract/golden

formatters:
  enable:
    - gofmt
    - goimports
